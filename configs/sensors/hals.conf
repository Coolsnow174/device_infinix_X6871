# Sensor sub-HAL configuration for the Infinix GT 20 Pro (X6871).
#
# XOS 16.3 ships two sensor sub-HALs:
#   * android.hardware.sensors@2.X-subhal-mediatek.so -> vendor/etc/sensors/hals.conf
#   * sensors.elliptic.so                            -> odm/etc/sensors/hals.conf
#
# The Elliptic (fingerprint/gesture) sub-HAL is installed into the odm
# partition, therefore it is not listed here.
android.hardware.sensors@2.X-subhal-mediatek.so
